<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Feedback Control</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="admin-body"><main class="admin-shell"><header class="admin-header"><div><span class="eyebrow">CONTROL PANEL // FEEDBACK</span><h1>لوحة التقييمات</h1><p>قراءة آراء الطلاب وتحليل التقييم العام.</p></div><div class="admin-actions"><button id="refreshButton" class="ghost-btn">↻ تحديث</button><button id="exportButton" class="export-btn">تصدير CSV</button></div></header><section class="stat-grid"><article><span>إجمالي التقييمات</span><strong id="totalStat">—</strong></article><article><span>متوسط التقييم</span><strong id="averageStat">—</strong></article><article><span>5 نجوم</span><strong id="fiveStat">—</strong></article><article><span>آخر 7 أيام</span><strong id="weekStat">—</strong></article></section><section class="admin-panel"><div class="panel-top"><div><h2>الرسائل</h2><span id="resultCount">جاري التحميل...</span></div><div class="admin-filters"><select id="ratingFilter"><option value="">كل التقييمات</option><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select><input id="searchInput" type="search" placeholder="ابحث داخل الرسائل..."></div></div><div id="feedbackList" class="feedback-list"><div class="loading-card">جاري تحميل التقييمات...</div></div></section></main><script src="admin.js"></script></body></html>
